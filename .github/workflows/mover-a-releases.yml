name: Mover compilaciones a Releases (una vez)
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  mover:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos y publicarlos como release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p up x
          for pair in 11949984142:PrusaSlicer-BrickLayers-win64; do
            id="${pair%%:*}"; name="${pair#*:}"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > a.zip
            mkdir -p "x/$name"; unzip -q a.zip -d "x/$name"; rm a.zip
            c=$(find "x/$name" -type f | wc -l)
            if [ "$c" = 1 ]; then f=$(find "x/$name" -type f); cp "$f" "up/$(basename "$f")"
            else (cd "x/$name" && zip -qr "$GITHUB_WORKSPACE/up/$name.zip" .); fi
          done
          ls -la up
          gh release create build-anterior up/* --repo "$GITHUB_REPOSITORY" --target "e3c82583fa5e21f716a3929d23d250ce0774cfbf" \
            --title "Compilación anterior (rama bricklayers)" \
            --notes "Última compilación que estaba guardada en Actions, movida a Releases. Commit e3c82583fa5e21f716a3929d23d250ce0774cfbf." --latest
          for pair in 11949984142:PrusaSlicer-BrickLayers-win64; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/${pair%%:*}"; done
