# Self-contained Windows build for the Brick Layers fork.
# The upstream build_windows.yml relies on Prusa's private actions repository
# and cannot run in a fork, so this workflow builds everything on the runner.
# The first run builds all dependencies (several hours); later runs reuse the
# dependency cache as long as nothing under deps/ changes.
#
# Dependencies are built in C:\d (short path) to stay clear of the Windows
# 260-character path limit inside the larger third-party builds.
# On failure, the error lines of the build log are published as job annotations
# so they can be read without downloading the full log.
name: Build windows (Brick Layers fork)

on:
  push:
    branches:
      - bricklayers
  workflow_dispatch:
    inputs:
      export_deps:
        description: 'Publish the compiled dependencies as a downloadable artifact'
        type: boolean
        default: false

concurrency:
  group: build-windows-bricklayers
  cancel-in-progress: true

env:
  DEPS_BUILD: C:/d
  # Each dependency already builds with -m:<cores> internally (cmake/modules/AddCMakeProject.cmake);
  # building the outer deps project in parallel too exhausts the runner (MSB4223).
  MSBUILDDISABLENODEREUSE: "1"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Enable long paths in git
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      # restore/save are split so the dependencies are cached as soon as they are built,
      # even if the PrusaSlicer build fails afterwards.
      - name: Restore dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: C:/d/destdir
          key: deps-win64-v2-${{ hashFiles('deps/**') }}

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cmake -S deps -B $env:DEPS_BUILD -G "Visual Studio 17 2022" -A x64 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/deps-configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $env:DEPS_BUILD --config Release -- /m:1 /nodeReuse:false 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/deps-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save dependencies to cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:/d/destdir
          key: deps-win64-v2-${{ hashFiles('deps/**') }}

      # Downloadable copy for local builds: extract to C:\d\destdir and pass
      # -DCMAKE_PREFIX_PATH=C:/d/destdir/usr/local (requires VS 2022 17.14 or newer).
      - name: Publish dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true' || inputs.export_deps
        uses: actions/upload-artifact@v4
        with:
          name: deps-win64-msvc-release
          path: C:/d/destdir
          retention-days: 14

      - name: Configure PrusaSlicer
        shell: pwsh
        run: |
          # cmake/modules/WinSDK.cmake finds the WinRT headers (Win10 mesh repair) through the
          # variables a VS developer prompt defines; set them since this is a plain shell.
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $sdk = Get-ChildItem "$kits\Include" -Directory |
                 Where-Object { Test-Path "$($_.FullName)\winrt\windows.graphics.printing3d.h" } |
                 Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw "No Windows SDK with WinRT headers found under $kits\Include" }
          $env:WindowsSdkDir = "$kits\"
          $env:WindowsSDKVersion = "$($sdk.Name)\"
          Write-Output "Using Windows SDK $($sdk.Name)"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:DEPS_BUILD/destdir/usr/local" -DSLIC3R_BUILD_TESTS=OFF 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build PrusaSlicer
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report build errors
        if: failure()
        shell: pwsh
        run: |
          $pattern = 'error MSB|error C\d+|error LNK\d+|error MSB\d+|fatal error|CMake Error|: error|FAILED|Error \d+|failed with|Each download failed'
          foreach ($name in 'deps-configure', 'deps-build', 'configure', 'build') {
            $log = "$env:RUNNER_TEMP/$name.log"
            if (-not (Test-Path $log)) { continue }
            $lines = Select-String -Path $log -Pattern $pattern | Select-Object -First 25 | ForEach-Object { $_.Line.Trim() }
            $tail  = Get-Content $log -Tail 25
            $text  = "[$name] first errors:`n" + ($lines -join "`n") + "`n--- last lines ---`n" + ($tail -join "`n")
            $text  = $text.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            if ($text.Length -gt 30000) { $text = $text.Substring(0, 30000) }
            Write-Output "::error title=$name log::$text"
          }

      - name: Collect binaries
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "prusa-slicer.exe" | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem -Path build -Recurse -Filter "*.exe" | Where-Object { $_.Name -like "*rusa*" } | Select-Object -First 1 }
          if (-not $exe) { throw "PrusaSlicer executable not found" }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse "$($exe.DirectoryName)\*" package\
          Copy-Item -Recurse resources package\resources -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: PrusaSlicer-BrickLayers-win64
          path: package
